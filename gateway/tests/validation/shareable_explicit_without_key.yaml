name: "Field shared with explicit @shareable works without @key"
description: |
  When a field exists on the same type in multiple subgraphs and is explicitly
  marked with @shareable, composition succeeds even without @key.

  This demonstrates that @lookup implies the key fields but does NOT make them
  automatically shareable - you still need @shareable or @key for that.

category: validation

source_schemas:
  - name: a
    sdl: |
      type Query {
        productById(id: ID!): Product @lookup
      }
      type Product {
        id: ID! @shareable
        price: Float!
      }

  - name: b
    sdl: |
      type Product {
        id: ID! @shareable
        name: String!
      }

validation:
  phase: pre_merge
  expect: valid
