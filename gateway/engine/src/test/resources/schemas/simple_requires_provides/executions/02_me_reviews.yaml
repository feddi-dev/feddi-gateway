name: "Me query with reviews from different subgraph"
description: "Fetches user id from accounts, then resolves reviews via @lookup on reviews subgraph"

query: |
  {
    me {
      id
      reviews {
        id
      }
    }
  }

variables: {}

subgraphCalls:
  - subgraph: accounts
    operation: '{ me { id } }'
    variables: {}
    response: { data: { me: { id: "u1" } } }

  - subgraph: reviews
    operation: 'query ($id: ID!) { userById(id: $id) { reviews { id } } }'
    variables: { id: "u1" }
    response: { data: { userById: { reviews: [{ id: "r1" }, { id: "r2" }] } } }

expectedResponse: {
  data: {
    me: { id: "u1", reviews: [{ id: "r1" }, { id: "r2" }] }
  }
}
