name: "Internal Local Effect"
description: |
  Tests that @internal has LOCAL effect (unlike @inaccessible which is global).

  - Subgraph A: productBySku(sku: ID!) @internal - hidden, local to A
  - Subgraph B: productBySku(sku: ID!) - NOT @internal, visible

  The field from subgraph B should appear in the supergraph because @internal
  only affects its own source schema. This is different from @inaccessible
  which would hide the field globally.

subgraphs:
  a: |
    type Query {
      products: [Product]
      productById(id: ID!): Product @lookup
      productBySku(sku: ID!): Product @internal @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String @shareable
    }

  b: |
    type Query {
      productById(id: ID!): Product @lookup
      productBySku(sku: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String @shareable
      price: Int
    }

supergraph: |
  type Query {
    productById(id: ID!): Product
    productBySku(sku: ID!): Product
    products: [Product]
  }

  type Product {
    id: ID!
    name: String
    price: Int
  }
