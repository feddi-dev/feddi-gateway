name: "Union lookup cross-subgraph"
description: "Union lookup with fields from different subgraphs"

query: |
  {
    mediaById(id: "b1") {
      ... on Book {
        id
        title
        rating
        reviewCount
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: '{ mediaById(id: "b1") { __typename ... on Book { id title } } }'
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: ratings
      operation: 'query ($id: ID!) { mediaById(id: $id) { ... on Book { rating reviewCount } } }'
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
