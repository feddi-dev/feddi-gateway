name: "Inventory only"
description: "Path to inventory subgraph with warehouse field"

query: |
  {
    products {
      stock
      warehouse
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ products { id } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: inventory
      operation: "query($id: ID!) { productByIdInventory(id: $id) { stock warehouse } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
