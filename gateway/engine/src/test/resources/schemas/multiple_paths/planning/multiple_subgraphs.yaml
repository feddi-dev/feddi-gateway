name: "Multiple subgraphs"
description: "Fields from catalog, inventory, and pricing with mixed arg styles"

query: |
  query($brand: String) {
    products(brand: $brand) {
      name
      brand
      stock
      warehouse
      price
      currency
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "query($brand: String) { products(brand: $brand) { name brand id } }"
      dependsOn: []
      repeatedExecution: false
    - parallel:
        - id: 2
          subgraph: inventory
          operation: "query($id: ID!) { productByIdInventory(id: $id) { stock warehouse } }"
          dependsOn: [1]
          requirements:
            id: "id"
          repeatedExecution: true
        - id: 3
          subgraph: pricing
          operation: "query($pid: ID!) { productByIdPricing(pid: $pid) { price currency } }"
          dependsOn: [1]
          requirements:
            pid: "id"
          repeatedExecution: true
