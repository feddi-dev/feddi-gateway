name: "Parallel Execution"
description: |
  Schema for testing parallel execution behavior.
  Tests that steps execute as soon as their dependencies complete,
  without waiting for unrelated steps at the same dependency level.

subgraphs:
  products: |
    type Query {
      products: [Product]
      productByIdCatalog(id: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String
    }

  pricing: |
    type Query {
      productById(id: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      price: Int
    }

  inventory: |
    type Query {
      productById(id: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      stock: Int
    }
