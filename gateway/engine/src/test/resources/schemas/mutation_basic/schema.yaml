name: "Mutation Basic"
description: "Tests mutation support with two subgraphs - products (owns Product) and reviews (extends Product with reviews)"

subgraphs:
  products: |
    type Query {
      products: [Product]
      productById(id: ID!): Product @lookup
    }

    type Mutation {
      createProduct(name: String!, price: Int!): Product
      updateProduct(id: ID!, name: String, price: Int): Product
      deleteProduct(id: ID!): Boolean
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String
      price: Int
    }

  reviews: |
    type Query {
      reviews: [Review]
      productById(id: ID!): Product @lookup
    }

    type Mutation {
      createReview(productId: ID!, text: String!, stars: Int!): Review
    }

    type Product @key(fields: "id") {
      id: ID!
      reviews: [Review]
    }

    type Review {
      id: ID!
      productId: ID!
      text: String
      stars: Int
    }

supergraph: |
  type Query {
    products: [Product]
    productById(id: ID!): Product
    reviews: [Review]
  }
  type Mutation {
    createProduct(name: String!, price: Int!): Product
    updateProduct(id: ID!, name: String, price: Int): Product
    deleteProduct(id: ID!): Boolean
    createReview(productId: ID!, text: String!, stars: Int!): Review
  }
  type Product {
    id: ID!
    name: String
    price: Int
    reviews: [Review]
  }
  type Review {
    id: ID!
    productId: ID!
    text: String
    stars: Int
  }
