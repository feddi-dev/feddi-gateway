name: "Consecutive mutation fields of one subgraph share a step"
description: "created and updated are consecutive products fields: one step, which the reviews step waits for."

query: |
  mutation {
    created: createProduct(name: "A", price: 1) { id }
    updated: updateProduct(id: "p1", name: "B") { id }
    review: createReview(productId: "p1", text: "Nice", stars: 5) { id }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: products
      operation: "mutation { created: createProduct(name: \"A\", price: 1) { id } updated: updateProduct(id: \"p1\", name: \"B\") { id } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: reviews
      operation: "mutation { review: createReview(productId: \"p1\", text: \"Nice\", stars: 5) { id } }"
      dependsOn: [1]
      repeatedExecution: false
