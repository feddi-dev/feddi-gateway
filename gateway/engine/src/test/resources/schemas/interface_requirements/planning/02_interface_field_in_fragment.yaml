name: "Interface field with @require in a fragment"
description: "price is selected for Movie only: only Movie's lookups run."

query: |
  {
    media {
      title
      ... on Movie {
        price
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ media { title __typename id } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: catalog
      operation: "query($id: ID!, $rate: Float) { movieById(id: $id) { price(rate: $rate) } }"
      dependsOn: [3]
      requirements:
        id: "id"
        rate: "rate"
      repeatedExecution: true

    - id: 3
      subgraph: pricing
      operation: "query($id: ID!) { movieById(id: $id) { id rate } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
