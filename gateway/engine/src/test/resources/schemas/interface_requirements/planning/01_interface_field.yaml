name: "Interface field with @require"
description: |
  price is selected on Media: it is resolved per possible type, each by re-entering catalog with the lookup of
  its type after pricing returned rate.

query: |
  {
    media {
      id
      title
      price
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ media { id title __typename } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: catalog
      operation: "query($id: ID!, $rate: Float) { bookById(id: $id) { price(rate: $rate) } }"
      dependsOn: [3]
      requirements:
        id: "id"
        rate: "rate"
      repeatedExecution: true

    - id: 3
      subgraph: pricing
      operation: "query($id: ID!) { bookById(id: $id) { id rate } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true

    - id: 4
      subgraph: catalog
      operation: "query($id: ID!, $rate: Float) { movieById(id: $id) { price(rate: $rate) } }"
      dependsOn: [5]
      requirements:
        id: "id"
        rate: "rate"
      repeatedExecution: true

    - id: 5
      subgraph: pricing
      operation: "query($id: ID!) { movieById(id: $id) { id rate } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
