name: "Inline fragment with ALL fields from different subgraph"
description: |
  Tests the case where an inline fragment's fields are ALL from a different subgraph.

  Query products (interface) with ... on Book { reviewsCount } where reviewsCount is only
  available in the reviews subgraph, not the products subgraph.

  The planner correctly flattens the inline fragment and fetches id at the interface level
  for entity resolution. This is valid behavior.

query: |
  {
    products {
      ... on Book {
        reviewsCount
      }
    }
  }

expectedPlan:
  steps:
    # Step 1: Fetch products - id fetched at interface level for entity resolution
    - id: 1
      subgraph: products
      operation: "{ products { __typename id } }"
      dependsOn: []
      repeatedExecution: false

    # Step 2: Look up each Book in reviews subgraph to get reviewsCount
    # Note: The inline fragment is preserved even though bookById returns Book directly.
    # This is semantically correct - the fragment is redundant but valid.
    - id: 2
      subgraph: reviews
      operation: "query($id: ID!) { bookById(id: $id) { ... on Book { reviewsCount } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
