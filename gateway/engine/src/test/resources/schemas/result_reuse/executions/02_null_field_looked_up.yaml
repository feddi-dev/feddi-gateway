name: "Root object with a null field does not answer the lookup"
description: |
  products returns p1 without a name (null, maybe for an error): the review's p1 is looked up.

query: |
  {
    products { id name }
    reviews { id product { id name } }
  }

variables: {}

subgraphCalls:
  - subgraph: catalog
    operation: '{products{id name}}'
    delayMs: 1
    variables: {}
    response: { data: { products: [{ id: "p1", name: null }] } }

  - subgraph: reviews
    operation: '{reviews{id product{id}}}'
    delayMs: 50
    variables: {}
    response: { data: { reviews: [{ id: "r1", product: { id: "p1" } }] } }

  - subgraph: catalog
    operation: 'query ($id:ID!){lookups{productById(id:$id){name}}}'
    variables: { id: "p1" }
    response: { data: { lookups: { productById: { name: "Table" } } } }

expectedResponse: {
  data: {
    products: [{ id: "p1", name: null }],
    reviews: [{ id: "r1", product: { id: "p1", name: "Table" } }]
  }
}
