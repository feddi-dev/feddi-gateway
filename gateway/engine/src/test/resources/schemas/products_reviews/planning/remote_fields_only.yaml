name: "Only remote fields"
description: "Query only fields from reviews subgraph - requires lookup"

query: |
  {
    products {
      rating
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: products
      operation: "{ products { id } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: reviews
      operation: "query($id: ID!) { productById(id: $id) { rating } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
