name: "Nested review fields"
description: "Fetch review text and stars"

query: |
  {
    products {
      reviews {
        text
        stars
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: products
      operation: "{ products { id } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: reviews
      operation: "query($id: ID!) { productById(id: $id) { reviews { text stars } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
