name: "Provides with non-provided field"
description: "Fetching discount (not in @provides) through relatedProduct still requires a lookup"

query: |
  {
    topProducts {
      id
      name
      relatedProduct {
        id
        price
        discount
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: products
      operation: "{ topProducts { id name relatedProduct { id price } } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: pricing
      operation: "query($id: ID!) { productById(id: $id) { discount } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
