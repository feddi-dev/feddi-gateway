name: "Direct price lookup"
description: "Fetching price directly on top products requires a lookup to the pricing subgraph"

query: |
  {
    topProducts {
      id
      name
      price
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: products
      operation: "{ topProducts { id name } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: pricing
      operation: "query($id: ID!) { productById(id: $id) { price } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
