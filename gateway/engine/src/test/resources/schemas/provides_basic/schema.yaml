name: "Provides Basic"
description: "Tests @provides directive - a field can provide external fields when accessed through a specific path"

subgraphs:
  products: |
    type Query {
      topProducts: [Product]
      productByIdCatalog(id: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String
      relatedProduct: Product @provides(fields: "price")
      price: Float @external
    }

  pricing: |
    type Query {
      productById(id: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      price: Float @shareable
      discount: Float
    }

supergraph: |
  type Query {
    topProducts: [Product]
    productById(id: ID!): Product
    productByIdCatalog(id: ID!): Product
  }
  type Product {
    id: ID!
    name: String
    relatedProduct: Product
    price: Float
    discount: Float
  }
