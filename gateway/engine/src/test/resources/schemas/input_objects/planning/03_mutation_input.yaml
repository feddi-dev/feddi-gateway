name: "Mutation input object"
description: "Tests planning with input objects in mutations"

query: |
  mutation CreateUser($input: CreateUserInput!) {
    createUser(input: $input) {
      id
      name
      email
      profile {
        bio
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: users
      operation: "mutation($input: CreateUserInput!) { createUser(input: $input) { id name email profile { bio } } }"
      dependsOn: []
      repeatedExecution: false
