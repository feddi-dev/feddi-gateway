name: "Cross-subgraph input object"
description: "Tests planning with input objects across subgraph boundaries"

query: |
  query GetUsersWithOrders($userFilter: UserFilter, $orderFilter: OrderFilter) {
    users(filter: $userFilter) {
      id
      name
      orderHistory(filter: $orderFilter) {
        id
        total
        status
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: users
      operation: "query($userFilter: UserFilter) { users(filter: $userFilter) { id name } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: orders
      operation: "query($id: ID!, $orderFilter: OrderFilter) { userById(id: $id) { orderHistory(filter: $orderFilter) { id total status } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
