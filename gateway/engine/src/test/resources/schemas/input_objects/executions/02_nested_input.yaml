name: "Nested input object"
description: "Tests passing a nested input object with DateRangeInput"

query: |
  query GetOrders($filter: OrderFilter) {
    orders(filter: $filter) {
      id
      total
      status
      createdAt
    }
  }

variables: { filter: { status: "SHIPPED", dateRange: { start: "2024-01-01", end: "2024-12-31" } } }

subgraphCalls:
  - subgraph: orders
    operation: 'query($filter: OrderFilter) { orders(filter: $filter) { id total status createdAt } }'
    variables: { filter: { status: "SHIPPED", dateRange: { start: "2024-01-01", end: "2024-12-31" } } }
    response: { data: { orders: [{ id: "o1", total: 150.0, status: "SHIPPED", createdAt: "2024-03-15" }] } }

expectedResponse: {
  data: {
    orders: [{ id: "o1", total: 150.0, status: "SHIPPED", createdAt: "2024-03-15" }]
  }
}
