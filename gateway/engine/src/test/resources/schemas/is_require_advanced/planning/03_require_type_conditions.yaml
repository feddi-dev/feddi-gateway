name: "@require with type conditions"
description: |
  Tests planning for @require directive with type condition syntax.

query: |
  {
    movieById(id: "m1") {
      id
      title
      similarMovies {
        id
        title
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: '{ movieById(id: "m1") { id title __typename imdbCode } }'
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: recommendations
      operation: "query($id: ID!, $code: String!) { movieById(id: $id) { similarMovies(code: $code) { id title } } }"
      dependsOn: [1]
      requirements:
        id: "id"
        code: "<Movie>.imdbCode"
      repeatedExecution: true
