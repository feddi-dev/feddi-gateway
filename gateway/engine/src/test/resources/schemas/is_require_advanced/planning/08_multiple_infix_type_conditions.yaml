name: "Multiple infix type conditions planning"
description: |
  Tests planning for multiple @require with same infix type condition base.
  Shows what operations the planner generates.

query: |
  {
    tvShowById(id: "t1") {
      id
      title
      relatedMedia {
        id
        title
      }
      relatedContent {
        id
      }
    }
  }

variables: {}

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ tvShowById(id: \"t1\") { id title relatedMedia { id title __typename ... on Movie { imdbCode internalCode } } } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: discovery
      operation: "query($id: ID!, $imdbCode: String, $internalCode: String) { tvShowById(id: $id) { relatedContent(imdbCode: $imdbCode, internalCode: $internalCode) { id } } }"
      dependsOn: [1]
      requirements:
        id: "id"
        imdbCode: "relatedMedia<Movie>.imdbCode"
        internalCode: "relatedMedia<Movie>.internalCode"
      repeatedExecution: true
