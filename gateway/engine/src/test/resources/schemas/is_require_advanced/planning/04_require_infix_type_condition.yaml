name: "@require with infix type condition planning"
description: |
  Tests planning for @require with infix type condition syntax: relatedMedia<Movie>.imdbCode
  The planner should generate an inline fragment to fetch imdbCode from the Movie type.

query: |
  {
    tvShowById(id: "t1") {
      id
      title
      relatedMedia {
        id
        title
      }
      relatedMovieRecommendations {
        id
        title
      }
    }
  }

variables: {}

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: '{ tvShowById(id: "t1") { id title relatedMedia { id title __typename ... on Movie { imdbCode } } } }'
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: recommendations
      operation: 'query($id: ID!, $code: String) { tvShowById(id: $id) { relatedMovieRecommendations(code: $code) { id title } } }'
      dependsOn: [1]
      requirements:
        id: "id"
        code: "relatedMedia<Movie>.imdbCode"
      repeatedExecution: true
