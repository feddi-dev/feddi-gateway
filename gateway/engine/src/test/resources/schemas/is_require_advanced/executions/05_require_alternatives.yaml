name: "@require with alternatives (pipe syntax)"
description: |
  Tests @require directive with alternatives syntax: imdbCode | internalCode
  The Movie.recommendations field uses the first available code (imdbCode if present,
  otherwise falls back to internalCode).

query: |
  {
    movieById(id: "m1") {
      id
      title
      recommendations {
        id
        title
      }
    }
  }

variables: {}

subgraphCalls:
  - subgraph: catalog
    operation: '{ movieById(id: "m1") { id title imdbCode internalCode } }'
    variables: {}
    response: {
      data: {
        movieById: {
          id: "m1",
          title: "Inception",
          imdbCode: "tt1375666",
          internalCode: "INT001"
        }
      }
    }

  - subgraph: discovery
    operation: 'query($id:ID!,$code:String){movieById(id:$id){recommendations(code:$code){id title}}}'
    variables: { id: "m1", code: "tt1375666" }
    response: {
      data: {
        movieById: {
          recommendations: [
            { id: "m2", title: "The Dark Knight" },
            { id: "m3", title: "Interstellar" }
          ]
        }
      }
    }

expectedResponse: {
  data: {
    movieById: {
      id: "m1",
      title: "Inception",
      recommendations: [
        { id: "m2", title: "The Dark Knight" },
        { id: "m3", title: "Interstellar" }
      ]
    }
  }
}
