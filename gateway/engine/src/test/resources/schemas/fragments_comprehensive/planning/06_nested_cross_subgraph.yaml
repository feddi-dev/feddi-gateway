name: "Nested inline fragments with cross-subgraph"
description: "Inline fragment with multiple fields from same cross-subgraph"

query: |
  {
    contents {
      id
      title
      ... on Article {
        body
        views
        readTime
        shareCount
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: "{ contents { id title __typename ... on Article { body } } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: analytics
      operation: "query($id: ID!) { contentById(id: $id) { ... on Article { views readTime shareCount } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
