name: "Multiple types with cross-subgraph fields"
description: "Multiple inline fragments each needing cross-subgraph resolution"

query: |
  {
    contents {
      id
      ... on Article {
        views
        shareCount
      }
      ... on Video {
        views
        watchTime
      }
      ... on Podcast {
        plays
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: "{ contents { id __typename } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: analytics
      operation: "query($id: ID!) { contentById(id: $id) { ... on Article { views shareCount } ... on Video { views watchTime } ... on Podcast { plays } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
