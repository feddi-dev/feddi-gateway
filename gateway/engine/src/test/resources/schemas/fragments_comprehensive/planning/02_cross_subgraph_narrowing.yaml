name: "Cross subgraph type narrowing"
description: "Inline fragment fields come from different subgraph than base query"

query: |
  {
    contents {
      id
      title
      ... on Article {
        views
        readTime
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: "{ contents { id title __typename } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: analytics
      operation: "query($id: ID!) { contentById(id: $id) { ... on Article { views readTime } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
