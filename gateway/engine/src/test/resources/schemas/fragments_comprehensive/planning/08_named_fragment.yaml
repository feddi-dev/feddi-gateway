name: "Inline fragment with all cross-subgraph fields"
description: "All fields in inline fragment come from cross-subgraph"

query: |
  {
    contents {
      id
      ... on Article {
        views
        readTime
        shareCount
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: "{ contents { id __typename } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: analytics
      operation: "query($id: ID!) { contentById(id: $id) { ... on Article { views readTime shareCount } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
