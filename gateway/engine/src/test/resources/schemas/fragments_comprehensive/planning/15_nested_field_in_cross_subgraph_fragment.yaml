name: "Nested field inside cross-subgraph inline fragment"
description: "Tests that nested fields are correctly placed inside inline fragments"

query: |
  {
    contents {
      id
      title
      ... on Article {
        suggestedArticles {
          id
        }
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: "{ contents { id title __typename } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: recommendations
      operation: "query($id: ID!) { contentById(id: $id) { ... on Article { suggestedArticles { id } } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
