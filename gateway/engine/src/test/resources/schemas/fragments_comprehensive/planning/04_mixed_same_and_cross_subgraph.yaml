name: "Mixed same and cross subgraph in inline fragment"
description: "Single inline fragment has fields from multiple subgraphs"

query: |
  {
    contents {
      id
      ... on Article {
        body
        wordCount
        views
        readTime
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: "{ contents { id __typename ... on Article { body wordCount } } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: analytics
      operation: "query($id: ID!) { contentById(id: $id) { ... on Article { views readTime } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
