name: "Interface field inside inline fragment"
description: "Multiple inline fragments each going to a different subgraph"

query: |
  {
    contents {
      id
      ... on Article {
        body
      }
      ... on Video {
        views
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: "{ contents { id __typename ... on Article { body } } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: analytics
      operation: "query($id: ID!) { contentById(id: $id) { ... on Video { views } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
