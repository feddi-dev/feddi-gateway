name: "Deeply nested fragments"
description: "Inline fragment with fields from two different cross-subgraphs"

query: |
  {
    contents {
      id
      ... on Article {
        body
        views
        shareCount
      }
      ... on Video {
        watchTime
        completionRate
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: "{ contents { id __typename ... on Article { body } } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: analytics
      operation: "query($id: ID!) { contentById(id: $id) { ... on Article { views shareCount } ... on Video { watchTime completionRate } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
