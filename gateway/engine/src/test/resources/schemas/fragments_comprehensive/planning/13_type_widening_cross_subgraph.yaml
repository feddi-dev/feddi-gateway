name: "Type widening with cross-subgraph"
description: "Starting from concrete Article, accessing fields from another subgraph"

query: |
  {
    article(id: "1") {
      id
      body
      views
      readTime
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: '{ article(id: "1") { id body } }'
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: analytics
      operation: "query($id: ID!) { articleById(id: $id) { views readTime } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
