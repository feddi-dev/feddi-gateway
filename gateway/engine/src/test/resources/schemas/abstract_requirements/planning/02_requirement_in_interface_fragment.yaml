name: "Requirement in an interface fragment"
description: |
  score is defined in content, where feed is, but its requirement votes is in stats: it is resolved by
  re-entering content with a lookup at feed (after stats), not inside feed's fragment.

query: |
  {
    feed {
      id
      ... on Post {
        score
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: "{ feed { id __typename ... on Post { id } } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: content
      operation: "query($id: ID!, $votes: Int) { postById(id: $id) { score(votes: $votes) } }"
      dependsOn: [3]
      requirements:
        id: "id"
        votes: "votes"
      repeatedExecution: true

    - id: 3
      subgraph: stats
      operation: "query($id: ID!) { postById(id: $id) { votes ... on Post { id } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
