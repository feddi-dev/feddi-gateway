name: "Alias clashes with @require dependency field name"
description: |
  Tests the edge case where a user's alias has the same name as a @require
  dependency field that would be added as artificial.
  Here, the user aliases 'canAfford' to 'isExpensive', but 'isExpensive' is
  also needed as an artificial dependency field for canAfford's @require.
  The aliased field should be in the response.

query: |
  {
    product {
      isExpensive: canAfford
    }
  }

variables: {}

subgraphCalls:
  - subgraph: b
    operation: '{ product { id } }'
    variables: {}
    response: { data: { product: { id: "p1" } } }

  - subgraph: a
    operation: 'query($id: ID!) { productByIdA(id: $id) { price } }'
    variables: { id: "p1" }
    response: { data: { productByIdA: { price: 699.99 } } }

  - subgraph: c
    operation: 'query($id: ID!, $p: Float) { productByIdC(id: $id) { isExpensive(p: $p) } }'
    variables: { id: "p1", p: 699.99 }
    response: { data: { productByIdC: { isExpensive: true } } }

  - subgraph: d
    operation: 'query($id: ID!, $ie: Boolean) { productByIdD(id: $id) { isExpensive: canAfford(ie: $ie) } }'
    variables: { id: "p1", ie: true }
    response: { data: { productByIdD: { isExpensive: false } } }

expectedResponse: { data: { product: { isExpensive: false } } }
