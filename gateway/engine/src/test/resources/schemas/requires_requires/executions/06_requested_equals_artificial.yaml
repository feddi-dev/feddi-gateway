name: "Requested field equals artificial @require dependency"
description: |
  Tests that when a field is both explicitly requested AND needed as an artificial
  dependency for @require, it is correctly included in the response.
  Here 'isExpensive' is requested AND used as a @require dependency for 'canAfford'.

query: |
  {
    product {
      id
      isExpensive
      canAfford
    }
  }

variables: {}

subgraphCalls:
  - subgraph: b
    operation: '{ product { id } }'
    variables: {}
    response: { data: { product: { id: "p1" } } }

  - subgraph: a
    operation: 'query($id: ID!) { productByIdA(id: $id) { price } }'
    variables: { id: "p1" }
    response: { data: { productByIdA: { price: 699.99 } } }

  - subgraph: c
    operation: 'query($id: ID!, $p: Float) { productByIdC(id: $id) { isExpensive(p: $p) } }'
    variables: { id: "p1", p: 699.99 }
    response: { data: { productByIdC: { isExpensive: true } } }

  - subgraph: d
    operation: 'query($id: ID!, $ie: Boolean) { productByIdD(id: $id) { canAfford(ie: $ie) } }'
    variables: { id: "p1", ie: true }
    response: { data: { productByIdD: { canAfford: false } } }

expectedResponse: {
  data: {
    product: {
      id: "p1",
      isExpensive: true,
      canAfford: false
    }
  }
}
