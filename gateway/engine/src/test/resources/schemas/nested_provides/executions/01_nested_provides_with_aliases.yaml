name: "Nested provides with aliases"
description: |
  Tests aliases when fetching nested entities through @provides.
  The categories are fetched via subcategories subgraph lookup.

query: |
  {
    items: products {
      productId: id
      productCategories: categories {
        catId: id
        catName: name
        subCats: subCategories {
          subCatId: id
          subCatName: name
        }
      }
    }
  }

variables: {}

subgraphCalls:
  # products @provides the whole categories selection: one request
  - subgraph: category
    operation: '{items:products{productId:id productCategories:categories{catId:id catName:name subCats:subCategories{subCatId:id subCatName:name}}}}'
    variables: {}
    response: {
      data: {
        items: [{
          productId: "p1",
          productCategories: [
            {
              catId: "c1",
              catName: "Electronics",
              subCats: [{ subCatId: "sc1", subCatName: "Laptops" }]
            }
          ]
        }]
      }
    }

expectedResponse: {
  data: {
    items: [
      {
        productId: "p1",
        productCategories: [
          {
            catId: "c1",
            catName: "Electronics",
            subCats: [{ subCatId: "sc1", subCatName: "Laptops" }]
          }
        ]
      }
    ]
  }
}
