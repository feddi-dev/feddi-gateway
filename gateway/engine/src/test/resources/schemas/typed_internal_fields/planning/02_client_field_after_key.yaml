name: "Client field after a key of another member"
description: |
  As 01, with Gift selected before Coupon: the key is added before the client's code is planned, and still gets
  an alias.

query: |
  {
    entries {
      ... on Gift {
        name
      }
      ... on Coupon {
        code
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ entries { __typename ... on Gift { __gql_code: code } ... on Coupon { code } } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: gifts
      operation: "query($code: String!) { giftByCode(code: $code) { name } }"
      dependsOn: [1]
      requirements:
        code: "__gql_code"
      repeatedExecution: true
