name: "Typed internal fields"
description: |
  A response key that one union member requests and another only needs as a lookup key, with a different
  nullability: the key gets an alias (fields with one response key must have the same shape).

subgraphs:
  catalog: |
    type Query {
      entries: [Entry]
    }

    union Entry = Coupon | Gift | Voucher

    type Coupon {
      code: String
    }

    type Gift @key(fields: "code") {
      code: String!
    }

    type Voucher @key(fields: "code") {
      code: String
    }

  gifts: |
    type Query {
      giftByCode(code: String!): Gift @lookup @internal
    }

    type Gift @key(fields: "code") {
      code: String!
      name: String
    }

  vouchers: |
    type Query {
      voucherByCode(code: String): Voucher @lookup @internal
    }

    type Voucher @key(fields: "code") {
      code: String
      discount: Int
    }
