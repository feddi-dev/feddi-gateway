name: "Shipping cost from nested weight"
description: |
  Tests that @require can reference nested non-entity data.
  Product.shippingCost requires details.weight where ProductDetails is a non-entity type.
  The weight value must be extracted from the nested ProductDetails object.

query: |
  {
    product(id: "1") {
      id
      shippingCost
    }
  }

variables: {}

subgraphCalls:
  - subgraph: products
    operation: '{ product(id: "1") { id details { weight } } }'
    variables: {}
    response: {
      data: {
        product: {
          id: "1",
          details: {
            weight: 2.5
          }
        }
      }
    }

  - subgraph: shipping
    operation: 'query ($id: ID!, $weight: Float) { productById(id: $id) { shippingCost(weight: $weight) } }'
    variables: { id: "1", weight: 2.5 }
    response: {
      data: {
        productById: {
          shippingCost: 12.50
        }
      }
    }

expectedResponse: {
  data: {
    product: {
      id: "1",
      shippingCost: 12.50
    }
  }
}
