name: "hidden_keys"

query: |
  { product(id: "1") { name reviews { body author { name } } } }

variables: {}

subgraphCalls:
  - subgraph: products
    operation: "{ product(id: \"1\") { name id } }"
    variables: {}
    response: {"data": {"product": {"id": "1", "name": "Keyboard"}}}
  - subgraph: reviews
    operation: "query ($id: ID!) { productById(id: $id) { reviews { body author { id } } } }"
    variables: {"id": "1"}
    response: {"data": {"productById": {"reviews": [{"body": "Great", "author": {"id": "1"}}, {"body": "Good", "author": {"id": "2"}}]}}}
  - subgraph: users
    operation: "query ($id: ID!) { user(id: $id) { name } }"
    variables: {"id": "1"}
    response: {"data": {"user": {"name": "Ada"}}}
  - subgraph: users
    operation: "query ($id: ID!) { user(id: $id) { name } }"
    variables: {"id": "2"}
    response: {"data": {"user": {"name": "Grace"}}}

expectedResponse: {"data": {"product": {"name": "Keyboard", "reviews": [{"body": "Great", "author": {"name": "Ada"}}, {"body": "Good", "author": {"name": "Grace"}}]}}}
