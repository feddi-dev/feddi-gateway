name: "sibling_aliases"

query: |
  { first: product(id: "1") { reviews { author { name } } } second: product(id: "2") { reviews { author { name } } } }

variables: {}

subgraphCalls:
  - subgraph: products
    operation: "{ first: product(id: \"1\") { id } second: product(id: \"2\") { id } }"
    variables: {}
    response: {"data": {"first": {"id": "1"}, "second": {"id": "2"}}}
  - subgraph: reviews
    operation: "query ($id: ID!) { productById(id: $id) { reviews { author { id } } } }"
    variables: {"id": "1"}
    response: {"data": {"productById": {"reviews": [{"author": {"id": "1"}}]}}}
  - subgraph: users
    operation: "query ($id: ID!) { user(id: $id) { name } }"
    variables: {"id": "1"}
    response: {"data": {"user": {"name": "Ada"}}}
  - subgraph: reviews
    operation: "query ($id: ID!) { productById(id: $id) { reviews { author { id } } } }"
    variables: {"id": "2"}
    response: {"data": {"productById": {"reviews": [{"author": {"id": "2"}}]}}}
  - subgraph: users
    operation: "query ($id: ID!) { user(id: $id) { name } }"
    variables: {"id": "2"}
    response: {"data": {"user": {"name": "Grace"}}}

expectedResponse: {"data": {"first": {"reviews": [{"author": {"name": "Ada"}}]}, "second": {"reviews": [{"author": {"name": "Grace"}}]}}}
