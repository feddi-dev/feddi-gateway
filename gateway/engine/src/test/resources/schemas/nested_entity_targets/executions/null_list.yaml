name: "null_list"

query: |
  { product(id: "1") { id name reviews { id body author { id name } } } }

variables: {}

subgraphCalls:
  - subgraph: products
    operation: "{ product(id: \"1\") { id name } }"
    variables: {}
    response: {"data": {"product": {"id": "1", "name": "Keyboard"}}}
  - subgraph: reviews
    operation: "query ($id: ID!) { productById(id: $id) { reviews { id body author { id } } } }"
    variables: {"id": "1"}
    response: {"data": {"productById": {"reviews": null}}}
  # No users call: the review list is null, so there are no authors to fetch.

expectedResponse: {"data": {"product": {"name": "Keyboard", "reviews": null, "id": "1"}}}
