name: "Cross-subgraph default arguments"
description: "Tests planning with defaults across subgraph boundaries"

query: |
  query SearchWithAnalytics($q: String!) {
    search(query: $q) {
      id
      title
      analytics {
        views
        clicks
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: search
      operation: "query($q: String!) { search(query: $q) { id title } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: analytics
      operation: "query($id: ID!) { searchResultById(id: $id) { analytics { views clicks } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
