name: "Schema default overridden"
description: "Tests planning when schema-defined default is overridden with explicit value"

query: |
  query Search($q: String!, $limit: Int) {
    search(query: $q, limit: $limit) {
      id
      title
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: search
      operation: "query($q: String!, $limit: Int) { search(query: $q, limit: $limit) { id title } }"
      dependsOn: []
      repeatedExecution: false
