name: "Introspection"
description: |
  Tests __schema and __type queries for introspection.
  Covers schema types, fields, enums, and mixing introspection with data queries.

subgraphs:
  products: |
    type Query {
      products: [Product]
      product(id: ID!): Product
      productById(id: ID!): Product @lookup
    }
    type Product @key(fields: "id") {
      id: ID!
      name: String
      price: Float
      status: ProductStatus
    }
    enum ProductStatus {
      DRAFT
      ACTIVE
      ARCHIVED
    }

  reviews: |
    type Query {
      productById(id: ID!): Product @lookup
    }
    type Product @key(fields: "id") {
      id: ID!
      reviews: [Review]
    }
    type Review {
      id: ID!
      rating: Int
      comment: String
    }

supergraph: |
  type Query {
    products: [Product]
    product(id: ID!): Product
    productById(id: ID!): Product
  }
  type Product {
    id: ID!
    name: String
    price: Float
    status: ProductStatus
    reviews: [Review]
  }
  enum ProductStatus {
    DRAFT
    ACTIVE
    ARCHIVED
  }
  type Review {
    id: ID!
    rating: Int
    comment: String
  }
