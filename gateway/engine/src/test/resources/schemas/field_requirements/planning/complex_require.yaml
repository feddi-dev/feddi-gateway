name: "Complex @require with nested fields"
description: "Delivery lookup requires dimension.size and dimension.weight from catalog"

query: |
  query($zip: String!) {
    products {
      name
      delivery(zip: $zip) {
        estimatedDays
        cost
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ products { name id dimension { size weight } } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: delivery
      operation: "query($id: ID!, $dim: ProductDimensionInput!, $zip: String!) { productByIdDelivery(id: $id) { delivery(zip: $zip, dim: $dim) { estimatedDays cost } } }"
      dependsOn: [1]
      requirements:
        id: "id"
        dim: "{ productSize: dimension.size, productWeight: dimension.weight }"
      repeatedExecution: true
