name: "Lookup with @require"
description: "Shipping lookup requires weight field from catalog"

query: |
  {
    products {
      name
      shippingCost
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ products { name id weight } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: shipping
      operation: "query($id: ID!, $w: Int) { productByIdShipping(id: $id) { shippingCost(w: $w) } }"
      dependsOn: [1]
      requirements:
        id: "id"
        w: "weight"
      repeatedExecution: true
