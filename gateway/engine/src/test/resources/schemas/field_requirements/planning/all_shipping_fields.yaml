name: "All shipping fields"
description: "Full shipping details - requires weight"

query: |
  {
    products {
      shippingCost
      estimatedDays
      carrier
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ products { id weight } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: shipping
      operation: "query($id: ID!, $w: Int) { productByIdShipping(id: $id) { shippingCost(w: $w) estimatedDays carrier } }"
      dependsOn: [1]
      requirements:
        id: "id"
        w: "weight"
      repeatedExecution: true
