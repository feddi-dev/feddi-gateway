name: "Multiple lookups"
description: "Query requiring both pricing and shipping lookups with different arg names"

query: |
  {
    products(category: "electronics") {
      name
      price
      discount
      shippingCost
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ products(category: \"electronics\") { name id weight } }"
      dependsOn: []
      repeatedExecution: false

    - parallel:
        - id: 2
          subgraph: pricing
          operation: "query($productId: ID!) { productByIdPricing(productId: $productId) { price discount } }"
          dependsOn: [1]
          requirements:
            productId: "id"
          repeatedExecution: true

        - id: 3
          subgraph: shipping
          operation: "query($id: ID!, $w: Int) { productByIdShipping(id: $id) { shippingCost(w: $w) } }"
          dependsOn: [1]
          requirements:
            id: "id"
            w: "weight"
          repeatedExecution: true
