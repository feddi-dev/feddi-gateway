name: "Provided random user with @provides"
description: "Fetches providedRandomUser where name is provided by subgraph a via @provides, no cross-subgraph call"

query: |
  {
    providedRandomUser {
      id
      rid
      name
    }
  }

variables: {}

subgraphCalls:
  # name is @external in a, but providedRandomUser @provides it: one request
  - subgraph: a
    operation: '{ providedRandomUser { id rid name } }'
    variables: {}
    response: { data: { providedRandomUser: { id: "u1", rid: "u1-rid", name: "u1-name" } } }

expectedResponse: {
  data: {
    providedRandomUser: { id: "u1", rid: "u1-rid", name: "u1-name" }
  }
}
