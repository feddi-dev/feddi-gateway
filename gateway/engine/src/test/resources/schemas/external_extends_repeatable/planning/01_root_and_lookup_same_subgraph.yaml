name: "Root query and entity lookup to same subgraph"
description: "Tests that root query and entity lookup to the same subgraph generate separate operations"

query: |
  {
    randomUser {
      id
      name
    }
    userById(id: "u2") {
      id
      name
    }
  }

plan:
  - id: 1
    subgraph: a
    operation: '{ randomUser { id } }'
  - id: 2
    subgraph: b
    dependsOn: [1]
    operation: 'query ($id: ID!) { userById(id: $id) { name } }'
  - id: 3
    subgraph: b
    operation: '{ userById(id: "u2") { id name } }'
