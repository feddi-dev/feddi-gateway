name: "Inline fragment with same type condition"
description: "Tests planning when inline fragment type condition matches current type (all fields inside fragment)"

query: |
  {
    contents {
      ... on Content {
        id
        title
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: content
      operation: "{ contents { id title } }"
      dependsOn: []
      repeatedExecution: false
