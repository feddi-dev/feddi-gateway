name: "Same lookup twice on a path"
description: |
  posts -> tags (postById, at topPost) -> posts (tagById, at topPost.tags) -> tags (postById again, at
  topPost.tags.relatedPosts). The second postById is its own lookup step with its own keys, not the first one
  (which made two steps wait for each other).

query: |
  {
    topPost {
      tags {
        relatedPosts {
          title
          tags {
            id
          }
        }
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: posts
      operation: "{ topPost { id } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: tags
      operation: "query($id: ID!) { postById(id: $id) { tags { id } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true

    - id: 3
      subgraph: posts
      operation: "query($id: ID!) { tagById(id: $id) { relatedPosts { title id } } }"
      dependsOn: [2]
      requirements:
        id: "id"
      repeatedExecution: true

    - id: 4
      subgraph: tags
      operation: "query($id: ID!) { postById(id: $id) { tags { id } } }"
      dependsOn: [3]
      requirements:
        id: "id"
      repeatedExecution: true
