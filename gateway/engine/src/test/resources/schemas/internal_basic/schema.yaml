name: "Internal Basic"
description: |
  Tests basic @internal directive behavior. Fields marked @internal are hidden
  from the supergraph and do not participate in schema merging.

subgraphs:
  a: |
    type Query {
      products: [Product]
      productById(id: ID!): Product @lookup
      # This internal lookup is hidden from supergraph
      productBySku(sku: ID!): Product @internal @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String @shareable
    }

  b: |
    type Query {
      productById(id: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String @shareable
      price: Int
    }

supergraph: |
  type Query {
    productById(id: ID!): Product
    products: [Product]
  }

  type Product {
    id: ID!
    name: String
    price: Int
  }
