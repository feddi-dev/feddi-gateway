name: "Same lookup edge with @require at different response paths"
description: |
  Both shelves.product and carts.product resolve shippingCost through the same
  Product lookup edge into shipping. The @require fields come from catalog and
  must be tracked separately for each response path.

query: |
  {
    shelves {
      product {
        shippingCost
      }
    }
    carts {
      product {
        shippingCost
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: store
      operation: "{ shelves { product { id } } carts { product { id } } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: shipping
      operation: "query($id: ID!, $weight: Int!, $price: Int!) { productShipping(id: $id) { shippingCost(weight: $weight, price: $price) } }"
      dependsOn: [1, 3]
      requirements:
        id: "id"
        weight: "weight"
        price: "price"
      repeatedExecution: true

    - id: 3
      subgraph: catalog
      operation: "query($id: ID!) { productById(id: $id) { weight price } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true

    - id: 4
      subgraph: shipping
      operation: "query($id: ID!, $weight: Int!, $price: Int!) { productShipping(id: $id) { shippingCost(weight: $weight, price: $price) } }"
      dependsOn: [1, 5]
      requirements:
        id: "id"
        weight: "weight"
        price: "price"
      repeatedExecution: true

    - id: 5
      subgraph: catalog
      operation: "query($id: ID!) { productById(id: $id) { weight price } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
