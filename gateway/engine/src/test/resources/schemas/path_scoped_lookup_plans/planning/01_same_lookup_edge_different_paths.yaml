name: "Same lookup edge at different response paths"
description: |
  The same Product lookup from store to catalog appears below shelves.product
  and carts.product. The planner must keep those lookup plans separate so each
  branch receives only its requested fields.

query: |
  {
    shelves {
      product {
        name
      }
    }
    carts {
      product {
        price
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: store
      operation: "{ shelves { product { id } } carts { product { id } } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: catalog
      operation: "query($id: ID!) { productById(id: $id) { name } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true

    - id: 3
      subgraph: catalog
      operation: "query($id: ID!) { productById(id: $id) { price } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
