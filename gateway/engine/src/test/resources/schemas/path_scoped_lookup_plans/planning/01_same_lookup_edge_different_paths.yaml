name: "Same lookup edge at different response paths"
description: |
  The same Product lookup from store to catalog appears below shelves.product
  and carts.product. The planner keeps a lookup step per branch (its own entity
  path), but both send one merged lookup, so that each product is fetched once;
  the other branch's fields are internal at each path, so each branch's
  response has only its requested fields (see executions/01).

query: |
  {
    shelves {
      product {
        name
      }
    }
    carts {
      product {
        price
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: store
      operation: "{ shelves { product { id } } carts { product { id } } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: catalog
      operation: "query($id: ID!) { productById(id: $id) { name price } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true

    - id: 3
      subgraph: catalog
      operation: "query($id: ID!) { productById(id: $id) { name price } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
