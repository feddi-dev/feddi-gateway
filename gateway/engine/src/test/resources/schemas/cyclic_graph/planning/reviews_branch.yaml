name: "Only reviews branch"
description: "Alternative branch"

query: |
  {
    users {
      reviews {
        text
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: users
      operation: "{ users { id } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: reviews
      operation: "query($id: ID!) { userByIdReviews(id: $id) { reviews { text } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
