name: "Union branch lookups"
description: "Each union member selects fields of the same entity field from a different subgraph; each lookup only runs for its member's items."

subgraphs:
  reviews: |
    type Query {
      reviews: [Review]
    }

    union Review = AnonymousReview | UserReview

    type AnonymousReview {
      product: Product
    }

    type UserReview {
      product: Product
    }

    type Product @key(fields: "id") {
      id: ID!
    }

  pricing: |
    type Query {
      productById(id: ID!): Product @lookup @internal
    }

    type Product @key(fields: "id") {
      id: ID!
      price: Float!
    }

  stock: |
    type Query {
      productById(id: ID!): Product @lookup @internal
    }

    type Product @key(fields: "id") {
      id: ID!
      inStock: Boolean!
    }
