name: "Multiple scalar variables"
description: "Tests planning with mix of Int, String, Boolean variables"

query: |
  query GetOrders($userId: ID!, $limit: Int, $includeArchived: Boolean) {
    orders(userId: $userId, limit: $limit, includeArchived: $includeArchived) {
      id
      total
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: orders
      operation: "query($userId: ID!, $limit: Int, $includeArchived: Boolean) { orders(userId: $userId, limit: $limit, includeArchived: $includeArchived) { id total } }"
      dependsOn: []
      repeatedExecution: false
