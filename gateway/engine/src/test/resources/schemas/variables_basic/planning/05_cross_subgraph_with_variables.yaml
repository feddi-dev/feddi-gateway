name: "Cross-subgraph with variables"
description: "Tests planning with variables that pass through entity lookups"

query: |
  query GetUserWithOrders($userId: ID!, $orderLimit: Int) {
    user(id: $userId) {
      id
      name
      recentOrders(limit: $orderLimit) {
        id
        total
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: users
      operation: "query($userId: ID!) { user(id: $userId) { id name } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: orders
      operation: "query($id: ID!, $orderLimit: Int) { userById(id: $id) { recentOrders(limit: $orderLimit) { id total } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
