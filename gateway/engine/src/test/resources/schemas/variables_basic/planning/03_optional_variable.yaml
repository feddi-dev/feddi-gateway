name: "Optional variable with default value"
description: "Tests planning with optional variable that has a default value"

query: |
  query GetOrders($userId: ID!, $limit: Int = 10) {
    orders(userId: $userId, limit: $limit) {
      id
      total
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: orders
      operation: "query($userId: ID!, $limit: Int = 10) { orders(userId: $userId, limit: $limit) { id total } }"
      dependsOn: []
      repeatedExecution: false
