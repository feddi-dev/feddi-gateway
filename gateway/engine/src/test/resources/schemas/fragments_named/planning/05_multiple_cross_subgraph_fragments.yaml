name: "Multiple fragments across subgraphs planning"
description: "Tests planning with separate fragments for fields from different subgraphs"

query: |
  query GetProductAllData {
    products {
      ...ProductBasics
      ...ProductInventory
      ...ProductReviews
    }
  }
  fragment ProductBasics on Product {
    id
    name
    price
  }
  fragment ProductInventory on Product {
    stock
    warehouse
  }
  fragment ProductReviews on Product {
    rating
    reviewCount
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: products
      operation: "{ products { id name price } }"
      dependsOn: []
      repeatedExecution: false
    - id: 2
      subgraph: inventory
      operation: "query($id: ID!) { productById(id: $id) { stock warehouse } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
    - id: 3
      subgraph: reviews
      operation: "query($id: ID!) { productById(id: $id) { rating reviewCount } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
