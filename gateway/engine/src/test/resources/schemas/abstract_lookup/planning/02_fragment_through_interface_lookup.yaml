name: "Inline fragment resolved through an interface lookup"
description: |
  Article.body is only in details, whose lookup returns Node: the lookup step keeps the
  type condition.

query: |
  {
    feed {
      ... on Article {
        title
        body
      }
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ feed { __typename id ... on Article { title } } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: details
      operation: "query($id: ID!) { node(id: $id) { ... on Article { body } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
