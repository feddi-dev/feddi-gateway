name: "Object type resolved through an interface lookup"
description: |
  catalog's Product does not implement Node, but details resolves Products through node(id:).
  The lookup returns Node, so the lookup step selects price on Product.

query: |
  {
    topProduct {
      name
      price
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: catalog
      operation: "{ topProduct { name id } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: details
      operation: "query($id: ID!) { node(id: $id) { ... on Product { price } } }"
      dependsOn: [1]
      requirements:
        id: "id"
      repeatedExecution: true
