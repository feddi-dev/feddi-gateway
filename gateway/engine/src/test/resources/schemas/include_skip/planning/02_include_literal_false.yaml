name: "@include(if: false) literal removes field from plan"
description: "When @include(if: false) is used with a literal boolean, the field should be completely removed from the plan and no downstream subgraph calls should be made for its @require chain"

query: |
  {
    product {
      id
      neverCalledInclude @include(if: false)
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: a
      operation: "{ product { id } }"
      dependsOn: []
      repeatedExecution: false
