name: "@include with variable false"
description: "The gateway evaluates @include(if: $showField) before planning: with showField false, include and its @require chain are not planned"

query: |
  query GetProduct($showField: Boolean!) {
    product {
      id
      include @include(if: $showField)
    }
  }

variables: { showField: false }

expectedPlan:
  steps:
    - id: 1
      subgraph: a
      operation: "{ product { id } }"
      dependsOn: []
      repeatedExecution: false
