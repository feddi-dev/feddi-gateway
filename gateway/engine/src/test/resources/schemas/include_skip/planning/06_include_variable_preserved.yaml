name: "@include with variable preserved in plan"
description: "When @include uses a variable, the directive is preserved and the full @require chain is included since the variable value is unknown at planning time"

query: |
  query GetProduct($showField: Boolean!) {
    product {
      id
      include @include(if: $showField)
    }
  }

expectedPlan:
  steps:
    - id: 1
      subgraph: a
      operation: "{ product { id price } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: c
      operation: "query ($id: ID!, $isExpensive: Boolean!, $showField: Boolean!) { productById(id: $id) { include(isExpensive: $isExpensive) @include(if: $showField) } }"
      dependsOn: [1, 3]
      requirements:
        id: "id"
        isExpensive: "isExpensive"
      repeatedExecution: true

    - id: 3
      subgraph: b
      operation: "query ($id: ID!, $price: Float!) { productById(id: $id) { isExpensive(price: $price) } }"
      dependsOn: [1]
      requirements:
        id: "id"
        price: "price"
      repeatedExecution: true
