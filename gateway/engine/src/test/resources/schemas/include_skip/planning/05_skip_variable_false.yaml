name: "@skip with variable false"
description: "The gateway evaluates @skip(if: $skipField) before planning: with skipField false, skip and its @require chain are planned without the directive"

query: |
  query GetProduct($skipField: Boolean!) {
    product {
      id
      skip @skip(if: $skipField)
    }
  }

variables: { skipField: false }

expectedPlan:
  steps:
    - id: 1
      subgraph: a
      operation: "{ product { id price } }"
      dependsOn: []
      repeatedExecution: false

    - id: 2
      subgraph: c
      operation: "query ($id: ID!, $isExpensive: Boolean!) { productById(id: $id) { skip(isExpensive: $isExpensive) } }"
      dependsOn: [3]
      requirements:
        id: "id"
        isExpensive: "isExpensive"
      repeatedExecution: true

    - id: 3
      subgraph: b
      operation: "query ($id: ID!, $price: Float!) { productById(id: $id) { isExpensive(price: $price) } }"
      dependsOn: [1]
      requirements:
        id: "id"
        price: "price"
      repeatedExecution: true
