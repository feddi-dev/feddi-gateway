name: "@include(if: false) prevents downstream calls"
description: "When @include(if: false) is used, the field is excluded and no downstream subgraph calls are made for its @require chain"

query: |
  {
    product {
      id
      neverCalledInclude @include(if: false)
    }
  }

variables: {}

subgraphCalls:
  - subgraph: a
    operation: '{ product { id } }'
    response: { data: { product: { id: "p1" } } }

expectedResponse: {
  data: {
    product: { id: "p1" }
  }
}
