name: "@include with variable=false excludes field at runtime"
description: "@include(if: $var) with var false: the field and the lookups for its requirements are not planned"

query: |
  query GetProduct($showField: Boolean!) {
    product {
      id
      include @include(if: $showField)
    }
  }

variables: { showField: false }

subgraphCalls:
  - id: step1
    subgraph: a
    operation: '{ product { id } }'
    variables: {}
    response: { data: { product: { id: "p1" } } }

expectedResponse: {
  data: {
    product: { id: "p1" }
  }
}
