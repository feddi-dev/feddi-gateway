name: "@skip with variable=true excludes field at runtime"
description: "@skip(if: $var) with var true: the field and the lookups for its requirements are not planned"

query: |
  query GetProduct($skipField: Boolean!) {
    product {
      id
      skip @skip(if: $skipField)
    }
  }

variables: { skipField: true }

subgraphCalls:
  - id: step1
    subgraph: a
    operation: '{ product { id } }'
    variables: {}
    response: { data: { product: { id: "p1" } } }

expectedResponse: {
  data: {
    product: { id: "p1" }
  }
}
