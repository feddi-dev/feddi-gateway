name: "@skip with variable=false includes field at runtime"
description: "@skip(if: $var) with var false: the field is planned without the directive"

query: |
  query GetProduct($skipField: Boolean!) {
    product {
      id
      skip @skip(if: $skipField)
    }
  }

variables: { skipField: false }

subgraphCalls:
  - id: step1
    subgraph: a
    operation: '{ product { id price } }'
    variables: {}
    response: { data: { product: { id: "p1", price: 100.0 } } }

  - id: step3
    subgraph: b
    operation: 'query ($id: ID!, $price: Float!) { productById(id: $id) { isExpensive(price: $price) } }'
    variables: { id: "p1", price: 100.0 }
    response: { data: { productById: { isExpensive: false } } }

  - id: step2
    subgraph: c
    operation: 'query ($id: ID!, $isExpensive: Boolean!) { productById(id: $id) { skip(isExpensive: $isExpensive) } }'
    variables: { id: "p1", isExpensive: false }
    response: { data: { productById: { skip: true } } }

expectedResponse: {
  data: {
    product: { id: "p1", skip: true }
  }
}
