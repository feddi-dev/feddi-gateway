name: "Empty list execution"
description: "Tests passing an empty list"

query: |
  query GetProducts($ids: [ID!]!) {
    productsByIds(ids: $ids) {
      id
      name
    }
  }

variables: { ids: [] }

subgraphCalls:
  - subgraph: products
    operation: 'query($ids: [ID!]!) { productsByIds(ids: $ids) { id name } }'
    variables: { ids: [] }
    response: { data: { productsByIds: [] } }

expectedResponse: {
  data: {
    productsByIds: []
  }
}
