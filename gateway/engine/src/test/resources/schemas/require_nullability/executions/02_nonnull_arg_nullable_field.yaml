name: "Non-null argument with null value, nullable field - returns null"
description: |
  When a @require argument has a non-null type (Float!) but the value is null,
  the request would be invalid: it is not sent and the field is null. The field
  is nullable (Float), so there is no error (as in ChilliCream's Fusion
  federation gateway).

query: |
  {
    product(id: "1") {
      id
      estimateRequired
    }
  }

variables: {}

subgraphCalls:
  - subgraph: products
    operation: '{ product(id: "1") { id weight } }'
    variables: {}
    response: {
      data: {
        product: {
          id: "1",
          weight: null
        }
      }
    }

  # NO second subgraph call - skipped because weight is null and argument is non-null!

expectedResponse: {
  data: {
    product: {
      id: "1",
      estimateRequired: null
    }
  }
}
