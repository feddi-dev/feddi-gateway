name: "Non-null argument with valid value - calls subgraph"
description: |
  NOT YET IMPLEMENTED - This test documents expected future behavior.

  When a @require argument has a non-null type (Float!) and the value is present,
  the subgraph should be called normally with the value.

  This is the happy path where the required value is available.

skip: true

query: |
  {
    product(id: "2") {
      id
      estimateRequired
    }
  }

variables: {}

subgraphCalls:
  - subgraph: products
    operation: '{ product(id: "2") { id weight } }'
    variables: {}
    response: {
      data: {
        product: {
          id: "2",
          weight: 5.5
        }
      }
    }

  - subgraph: shipping
    operation: 'query ($id: ID!, $weight: Float!) { productById(id: $id) { estimateRequired(weight: $weight) } }'
    variables: { id: "2", weight: 5.5 }
    response: {
      data: {
        productById: {
          estimateRequired: 12.99
        }
      }
    }

expectedResponse: {
  data: {
    product: {
      id: "2",
      estimateRequired: 12.99
    }
  }
}
