name: "Non-null argument with null value, non-null field - error"
description: |
  NOT YET IMPLEMENTED - This test documents expected future behavior.

  When a @require argument has a non-null type (Float!) but the value is null,
  and the field's return type is also non-null (Float!), the subgraph call should
  be skipped, the field should be null, and an error should be added to the response.

  This is Case 3 of the @require nullability handling:
  - Argument type: non-null (Float!)
  - Value: null
  - Field return type: non-null (Float!)
  - Behavior: Skip call, return null, add error

skip: true

query: |
  {
    product(id: "1") {
      id
      estimateStrict
    }
  }

variables: {}

subgraphCalls:
  - subgraph: products
    operation: '{ product(id: "1") { id weight } }'
    variables: {}
    response: {
      data: {
        product: {
          id: "1",
          weight: null
        }
      }
    }

  # NO second subgraph call - error instead because weight is null and both arg and field are non-null!

expectedResponse: {
  data: {
    product: {
      id: "1",
      estimateStrict: null
    }
  },
  errors: [{
    message: "Cannot resolve field 'estimateStrict': required argument 'weight' resolved to null",
    extensions: { code: "REQUIRED_ARGUMENT_NULL", argumentName: "weight" }
  }]
}
