name: "Non-null argument with null value, non-null field - null propagates to the parent"
description: |
  When a @require argument has a non-null type (Float!) but the value is null,
  the request is not sent and the field is null. The field is non-null (Float!),
  so the null propagates to the nearest nullable parent (product) with an error
  at the field's path, as the GraphQL spec describes in "Handling Execution
  Errors".

query: |
  {
    product(id: "1") {
      id
      estimateStrict
    }
  }

variables: {}

subgraphCalls:
  - subgraph: products
    operation: '{ product(id: "1") { id weight } }'
    variables: {}
    response: {
      data: {
        product: {
          id: "1",
          weight: null
        }
      }
    }

  # NO second subgraph call: weight is null and the argument is non-null

expectedResponse: {
  data: {
    product: null
  },
  errors: [{
    message: "Cannot return null for non-nullable field Product.estimateStrict.",
    path: ["product", "estimateStrict"]
  }]
}
