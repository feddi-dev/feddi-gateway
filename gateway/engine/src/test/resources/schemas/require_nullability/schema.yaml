name: "Require Nullability Tests"
description: |
  @require argument nullability, as in ChilliCream's Fusion federation gateway:
  - Case 1: nullable argument, value null -> call the subgraph with null
  - Case 2: non-null argument, value null, nullable field -> no call, field null
  - Case 3: non-null argument, value null, non-null field -> no call, the null
    propagates to the nearest nullable parent with an error
  - Case 4: non-null argument with a value -> normal call

subgraphs:
  products: |
    type Query {
      product(id: ID!): Product @lookup
      products: [Product]
    }

    type Product @key(fields: "id") {
      id: ID!
      weight: Float
      category: String!
    }

  shipping: |
    type Query {
      productById(id: ID! @is(field: "id")): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      estimateNullable(weight: Float @require(field: "weight")): Float
      estimateRequired(weight: Float! @require(field: "weight")): Float
      estimateStrict(weight: Float! @require(field: "weight")): Float!
    }

supergraph: |
  type Query {
    product(id: ID!): Product
    products: [Product]
    productById(id: ID!): Product
  }

  type Product {
    id: ID!
    weight: Float
    category: String!
    estimateNullable: Float
    estimateRequired: Float
    estimateStrict: Float!
  }
