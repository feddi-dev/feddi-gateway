name: "TYPE_DEFINITION_INVALID - @key missing required fields argument"
description: "Spec: Directive @key must have a 'fields' argument"

subgraphs:
  schemaA: |
    directive @key(futureArg: String) repeatable on OBJECT | INTERFACE

    type Query {
      books: [Book]
    }

    type Book @key(futureArg: "test") {
      id: ID!
      title: String
    }

error: "TYPE_DEFINITION_INVALID"
