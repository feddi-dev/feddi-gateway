name: "IS_INVALID_USAGE - @is on mutation argument"
description: "Spec 3.1.3.3: The @is directive can only be used on arguments of @lookup fields"

subgraphs:
  users: |
    type Query {
      users: [User]
    }
    
    type Mutation {
      updateUser(id: ID! @is(field: "id"), name: String!): User
    }
    
    type User @key(fields: "id") {
      id: ID!
      name: String
    }

error: "IS_INVALID_USAGE"
