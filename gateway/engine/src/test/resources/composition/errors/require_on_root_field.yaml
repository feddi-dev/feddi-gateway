name: "REQUIRE_ON_ROOT_FIELD - @require on a root field"
description: |
  Not a spec rule: feddi resolves requirements of objects it enters through a lookup, so a requirement on a
  root field (here filled from another schema's Query.category) is not supported.

subgraphs:
  search: |
    type Query {
      search(term: String!, filter: String @require(field: "category")): [String]
    }

  settings: |
    type Query {
      category: String
    }

error: "REQUIRE_ON_ROOT_FIELD"
