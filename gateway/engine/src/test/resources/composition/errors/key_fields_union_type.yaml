name: "KEY_FIELDS_SELECT_INVALID_TYPE - @key references union field"
description: "Spec: @key fields cannot reference fields that return a union type"

subgraphs:
  products: |
    type Query {
      product: Product
    }

    type Product @key(fields: "media") {
      id: ID!
      media: Media
    }

    union Media = Image | Video

    type Image {
      url: String
    }

    type Video {
      url: String
    }

error: "KEY_FIELDS_SELECT_INVALID_TYPE"
