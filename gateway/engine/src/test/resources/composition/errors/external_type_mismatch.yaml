name: "EXTERNAL_TYPE_MISMATCH - external field type differs from base"
description: "Spec: @external fields must have the same type as their base definition"

subgraphs:
  schemaA: |
    type Query {
      product: Product
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String
    }

  schemaB: |
    type Query {
      productById(id: ID!): Product @lookup @provides(fields: "name")
    }

    type Product @key(fields: "id") {
      id: ID!
      name: Int @external
    }

error: "EXTERNAL_TYPE_MISMATCH"
