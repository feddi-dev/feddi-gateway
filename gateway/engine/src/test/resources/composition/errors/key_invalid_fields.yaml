name: "KEY_INVALID_FIELDS - @key references non-existent field"
description: "Spec: @key fields argument must reference existing fields on the type"

subgraphs:
  products: |
    type Query {
      product: Product
    }

    type Product @key(fields: "id sku") {
      id: ID!
      name: String
    }

error: "KEY_INVALID_FIELDS"
