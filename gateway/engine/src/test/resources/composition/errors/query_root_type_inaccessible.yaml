name: "QUERY_ROOT_TYPE_INACCESSIBLE - Query type marked as @inaccessible"
description: "Spec 3.1.1.4: The Query root type must not be marked as @inaccessible"

subgraphs:
  products: |
    type Query @inaccessible {
      products: [Product]
    }
    
    type Product @key(fields: "id") {
      id: ID!
      name: String
    }

error: "QUERY_ROOT_TYPE_INACCESSIBLE"
