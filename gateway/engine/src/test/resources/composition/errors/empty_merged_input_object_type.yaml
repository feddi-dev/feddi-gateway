name: "EMPTY_MERGED_INPUT_OBJECT_TYPE - input type with all fields inaccessible"
description: "Spec 3.4.3.1: Input object types must have at least one accessible field after merging"

subgraphs:
  users: |
    type Query {
      users(filter: UserFilter): [User]
    }
    
    type User @key(fields: "id") {
      id: ID!
      name: String
    }
    
    input UserFilter {
      internalFlag: Boolean @inaccessible
    }

error: "EMPTY_MERGED_INPUT_OBJECT_TYPE"
