name: "LOOKUP_RETURNS_LIST - lookup field returns non-null list"
description: "Spec 3.1.5.2: A @lookup field must not return a list type (even if wrapped in non-null)"

subgraphs:
  products: |
    type Query {
      productsByCategory(categoryId: ID!): [Product!]! @lookup
    }
    
    type Product @key(fields: "id") {
      id: ID!
      name: String
      categoryId: ID
    }

error: "LOOKUP_RETURNS_LIST"
