name: "PROVIDES_DIRECTIVE_IN_FIELDS_ARGUMENT - directive in @provides fields"
description: "The fields argument of @provides must not contain directives"

subgraphs:
  reviews: |
    type Query {
      reviews: [Review]
    }

    type Review {
      id: ID!
      product: Product @provides(fields: "name @deprecated")
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String @external
    }

  products: |
    type Query {
      productById(id: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String
    }

error: "PROVIDES_DIRECTIVE_IN_FIELDS_ARGUMENT"
