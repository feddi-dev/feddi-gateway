name: "SATISFIABILITY_ERROR - Lookup chain broken"
description: |
  Tests that satisfiability validation catches fields that are unreachable in the supergraph.
  The catalog subgraph returns Product, and inventory extends it with extra fields,
  but there's no lookup from catalog to inventory, so inventory fields are unreachable.

subgraphs:
  catalog: |
    type Query {
      products: [Product]
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String
      description: String
    }

  inventory: |
    type Query {
      inventoryStatus: String
      productByIdInventory(id: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      stockLevel: Int
      warehouse: String
    }

error: "SATISFIABILITY_ERROR"
