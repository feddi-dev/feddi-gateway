name: "INVALID_FIELD_SHARING - field shareable only on one side"
description: "Spec 3.2.7.1: Fields must be marked @shareable on ALL subgraphs that define them"

subgraphs:
  products: |
    type Query {
      products: [Product]
    }
    
    type Product @key(fields: "id") {
      id: ID!
      name: String @shareable
      description: String
    }

  catalog: |
    type Query {
      productByIdCatalog(id: ID!): Product @lookup
    }
    
    type Product @key(fields: "id") {
      id: ID!
      name: String
      category: String
    }

error: "INVALID_FIELD_SHARING"
