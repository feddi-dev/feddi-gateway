name: "KEY_INVALID_SYNTAX - fields argument with only whitespace"
description: "Spec 3.1.4.4: The @key directive must have a valid non-empty fields argument"

subgraphs:
  products: |
    type Query {
      products: [Product]
    }
    
    type Product @key(fields: "   ") {
      id: ID!
      name: String
    }

error: "KEY_INVALID_SYNTAX"
