name: "KEY_FIELDS_HAS_ARGUMENTS - @key references field with arguments"
description: "Spec: @key fields cannot reference fields that have arguments"

subgraphs:
  products: |
    type Query {
      product: Product
    }

    type Product @key(fields: "sku") {
      id: ID!
      sku(format: String): String
    }

error: "KEY_FIELDS_HAS_ARGUMENTS"
