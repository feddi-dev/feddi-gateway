name: "Field arguments - only those every source schema declares"
description: "MergeOutputFields keeps an argument only if every field it merges declares it"

subgraphs:
  users: |
    type Query {
      users(limit: Int, sortBy: String): [User] @shareable
      userById(id: ID!): User @lookup
    }

    type User @key(fields: "id") @shareable {
      id: ID!
      name: String
    }

  profiles: |
    type Query {
      users(limit: Int, offset: Int, filter: String): [User] @shareable
      userByIdProfiles(id: ID!): User @lookup
    }
    
    type User @key(fields: "id") @shareable {
      id: ID!
      avatar: String
    }

supergraph: |
  type Query {
    users(limit: Int): [User]
    userById(id: ID!): User
    userByIdProfiles(id: ID!): User
  }
  
  type User {
    id: ID!
    name: String
    avatar: String
  }
