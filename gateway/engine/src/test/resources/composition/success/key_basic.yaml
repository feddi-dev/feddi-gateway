name: "@key basic - single field key"
description: "Entity with a single field @key directive"

subgraphs:
  users: |
    type Query {
      users: [User]
      userById(id: ID!): User @lookup
    }

    type User @key(fields: "id") {
      id: ID!
      name: String
      email: String
    }

  orders: |
    type Query {
      userByIdOrders(userId: ID! @is(field: "id")): User @lookup
    }
    
    type User @key(fields: "id") {
      id: ID!
      orders: [Order]
    }
    
    type Order {
      id: ID!
      total: Float
      status: String
    }

supergraph: |
  type Query {
    users: [User]
    userById(id: ID!): User
    userByIdOrders(userId: ID!): User
  }
  
  type User {
    id: ID!
    name: String
    email: String
    orders: [Order]
  }
  
  type Order {
    id: ID!
    total: Float
    status: String
  }
