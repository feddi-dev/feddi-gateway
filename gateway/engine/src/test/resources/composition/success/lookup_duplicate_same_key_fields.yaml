name: "Two lookups with the same return type and key fields"
description: "Not a spec error: LOOKUP_DUPLICATE is a warning, the planner uses either lookup."

subgraphs:
  products: |
    type Query {
      productById(id: ID!): Product @lookup
      productByKey(key: ID! @is(field: "id")): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String
    }

supergraph: |
  type Query {
    productById(id: ID!): Product
    productByKey(key: ID!): Product
  }

  type Product {
    id: ID!
    name: String
  }
