name: "@lookup basic - entity resolution"
description: |
  Basic @lookup field for entity resolution between subgraphs.

  All arguments of a lookup field together make up the key fields for the entity.
  The @is directive is optional - it's only needed when the argument name differs
  from the field name on the return type.

subgraphs:
  products: |
    type Query {
      products: [Product]
      productById(id: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      name: String
      description: String
    }

  reviews: |
    type Query {
      productByIdReviews(id: ID!): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      averageRating: Float
      reviewCount: Int
      reviews: [Review]
    }
    
    type Review {
      id: ID!
      text: String
      rating: Int
      author: String
    }

supergraph: |
  type Query {
    products: [Product]
    productById(id: ID!): Product
    productByIdReviews(id: ID!): Product
  }
  
  type Product {
    id: ID!
    name: String
    description: String
    averageRating: Float
    reviewCount: Int
    reviews: [Review]
  }
  
  type Review {
    id: ID!
    text: String
    rating: Int
    author: String
  }
