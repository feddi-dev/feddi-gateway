name: Fusion RequirementReentrancyTests.Plan_Should_Inline_Separate_LookupRequirements_When_Targeting_Same_NodeBranch
description: Imported from ChilliCream/graphql-platform 972f3f9 (972f3f9e39f19614d625cd3948a52c5d89565d03), src/HotChocolate/Fusion/test/Fusion.Execution.Tests/Planning/RequirementReentrancyTests.cs. MIT License.
subgraphs:
  PRODUCTS: |-
    schema {
      query: Query
    }

    interface Node {
      id: ID!
    }

    type Query {
      node(id: ID!): Node @lookup @shareable
      productById(id: Int! @is(field: "productId")): Product @lookup @internal
    }

    type Product implements Node @key(fields: "productId") {
      productId: Int!
      id: ID!
      reviewAudience: String!
      recommendationAudience: String!
    }
  REVIEWS: |-
    schema {
      query: Query
    }

    type Query {
      productById(id: Int! @is(field: "productId")): Product @lookup @internal
    }

    type Product @key(fields: "productId") {
      productId: Int!
      reviews(
        audience: String! @require(field: "reviewAudience"))
        : [Review!]
    }

    type Review {
      body: String
    }
  RECOMMENDATIONS: |-
    schema {
      query: Query
    }

    type Query {
      productById(id: Int! @is(field: "productId")): Product @lookup @internal
    }

    type Product @key(fields: "productId") {
      productId: Int!
      recommendations(
        audience: String! @require(field: "recommendationAudience"))
        : [Recommendation!]
    }

    type Recommendation {
      text: String
    }
