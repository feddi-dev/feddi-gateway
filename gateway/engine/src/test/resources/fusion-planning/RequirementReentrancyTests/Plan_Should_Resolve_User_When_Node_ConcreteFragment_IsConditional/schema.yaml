name: Fusion RequirementReentrancyTests.Plan_Should_Resolve_User_When_Node_ConcreteFragment_IsConditional
description: Imported from ChilliCream/graphql-platform 972f3f9 (972f3f9e39f19614d625cd3948a52c5d89565d03), src/HotChocolate/Fusion/test/Fusion.Execution.Tests/Planning/RequirementReentrancyTests.cs. MIT License.
subgraphs:
  PRODUCTS: |-
    schema {
      query: Query
    }

    interface Node {
      id: ID!
    }

    type Query {
      node(id: ID!): Node @lookup @shareable
      searchProduct: SearchResult
      productById(id: Int! @is(field: "productId")): Product @lookup @internal
    }

    union SearchResult = ProductSearchResult

    type ProductSearchResult {
      product: Product!
    }

    type Product implements Node @key(fields: "productId") {
      productId: Int!
      id: ID!
      reviewAudience: String!
    }
  REVIEWS: |-
    schema {
      query: Query
    }

    interface Node {
      id: ID!
    }

    type Query {
      node(id: ID!): Node @lookup @shareable
      productById(id: Int! @is(field: "productId")): Product @lookup @internal
    }

    type Product @key(fields: "productId") {
      productId: Int!
      reviews(
        audience: String! @require(field: "reviewAudience"))
        : [Review!]
    }

    type Review implements Node {
      id: ID!
      author: User
    }

    type User @key(fields: "userId") {
      userId: ID!
    }
  USERS: |-
    schema {
      query: Query
    }

    type Query {
      userById(id: ID! @is(field: "userId"))
        : User @lookup @internal
    }

    type User @key(fields: "userId") {
      userId: ID!
      name: String
    }
