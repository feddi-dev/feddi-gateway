name: Fusion RequirementReentrancyTests.Plan_Should_Reenter_Catalog_When_EnteringFromRecommendation_Standalone
description: Imported from ChilliCream/graphql-platform 972f3f9 (972f3f9e39f19614d625cd3948a52c5d89565d03), src/HotChocolate/Fusion/test/Fusion.Execution.Tests/Planning/RequirementReentrancyTests.cs. MIT License.
subgraphs:
  CATALOG: |-
    schema {
      query: Query
    }

    type Query {
      products: [Product!]
      productById(id: ID! @is(field: "id")): Product @lookup
    }

    type Product @key(fields: "id") {
      id: ID!
      category: ProductCategory!
    }

    enum ProductCategory {
      ELECTRONICS
      BOOKS
    }
  RECOMMENDATION: |-
    schema {
      query: Query
    }

    type Query {
      recommendations: [Recommendation!]
      productById(id: ID! @is(field: "id")): Product @lookup @internal
    }

    type Product @key(fields: "id") {
      id: ID!
      recommendations(
        category: ProductCategory! @require(field: "category")): [Recommendation!]
    }

    type Recommendation @key(fields: "id") {
      id: ID!
      product: Product
    }

    enum ProductCategory {
      ELECTRONICS
      BOOKS
    }
