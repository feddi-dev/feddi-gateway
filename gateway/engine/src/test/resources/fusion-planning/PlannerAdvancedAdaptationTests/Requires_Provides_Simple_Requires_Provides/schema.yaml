description: Imported from ChilliCream/graphql-platform 972f3f9 (972f3f9e39f19614d625cd3948a52c5d89565d03), src/HotChocolate/Fusion/test/Fusion.Execution.Tests/Planning/PlannerAdvancedAdaptationTests.cs. MIT License.
subgraphs:
  accounts: |-
    schema {
      query: Query
    }

    type Query {
      me: User
      userById(id: ID! @is(field: "id")): User @lookup @internal
    }

    type User @key(fields: "id") {
      id: ID!
      username: String
      name: String
    }
  reviews: |-
    schema {
      query: Query
    }

    type Query {
      userById(id: ID! @is(field: "id")): User @lookup @internal
    }

    type User @key(fields: "id") {
      id: ID!
      username: String @external
      reviews: [Review]
    }

    type Review @key(fields: "id") {
      id: ID!
      author: User @provides(fields: "username")
      product: Product
    }

    type Product @key(fields: "upc") {
      upc: String!
    }
  inventory: |-
    schema {
      query: Query
    }

    type Query {
      productByUpc(upc: String! @is(field: "upc")): Product @lookup @internal
    }

    type Product @key(fields: "upc") {
      upc: String!
      inStock: Boolean
    }
