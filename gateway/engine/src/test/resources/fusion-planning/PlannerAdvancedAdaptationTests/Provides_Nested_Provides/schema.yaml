name: Fusion PlannerAdvancedAdaptationTests.Provides_Nested_Provides
description: Imported from ChilliCream/graphql-platform 972f3f9 (972f3f9e39f19614d625cd3948a52c5d89565d03), src/HotChocolate/Fusion/test/Fusion.Execution.Tests/Planning/PlannerAdvancedAdaptationTests.cs. MIT License.
subgraphs:
  all-products: |-
    schema {
      query: Query
    }

    type Query {
      products: [Product]
    }

    type Product @key(fields: "id") {
      id: ID!
      categories: [Category]
        @provides(fields: "id name details { id name }")
    }

    type Category @key(fields: "id") {
      id: ID! @external
      name: String @external
      details: CategoryDetails @external
    }

    type CategoryDetails {
      id: ID! @external
      name: String @external
    }
  category: |-
    schema {
      query: Query
    }

    type Query {
      categoryById(id: ID! @is(field: "id")): Category @lookup @internal
    }

    type Category @key(fields: "id") {
      id: ID!
      name: String
      details: CategoryDetails
    }

    type CategoryDetails {
      id: ID!
      name: String
    }
