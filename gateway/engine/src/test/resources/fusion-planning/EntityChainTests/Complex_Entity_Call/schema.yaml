name: Fusion EntityChainTests.Complex_Entity_Call
description: Imported from ChilliCream/graphql-platform 972f3f9 (972f3f9e39f19614d625cd3948a52c5d89565d03), src/HotChocolate/Fusion/test/Fusion.Execution.Tests/Planning/EntityChainTests.cs. MIT License.
subgraphs:
  products: |-
    schema {
      query: Query
    }

    type Query {
      topProducts: ProductList!
    }

    type ProductList {
      products: [Product!]!
    }

    type Product @key(fields: "id") {
      id: ID!
      category: Category! @shareable
    }

    type Category {
      id: ID! @shareable
      tag: String @shareable
    }
  link: |-
    schema {
      query: Query
    }

    type Query {
      productById(id: ID! @is(field: "id")): Product @lookup @internal
    }

    type Product @key(fields: "id") {
      id: ID!
      pid: ID! @shareable
    }
  price: |-
    schema {
      query: Query
    }

    type Query {
      productByIdPidAndCategory(
        id: ID! @is(field: "id")
        pid: ID! @is(field: "pid")
        categoryId: ID! @is(field: "category.id")
        categoryTag: String @is(field: "category.tag")): Product @lookup @internal
    }

    type Product @key(fields: "id pid category { id tag }") {
      id: ID!
      pid: ID! @shareable
      category: Category! @shareable
      price: Price
    }

    type Category {
      id: ID! @shareable
      tag: String @shareable
    }

    type Price {
      price: Float!
    }
