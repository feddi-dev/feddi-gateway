name: Fusion ProvidesPlannerTests.Provides_Shareable_Override
description: Imported from ChilliCream/graphql-platform 972f3f9 (972f3f9e39f19614d625cd3948a52c5d89565d03), src/HotChocolate/Fusion/test/Fusion.Execution.Tests/Planning/ProvidesPlannerTests.cs. MIT License.
subgraphs:
  products: |-
    schema {
      query: Query
    }

    type Query {
      products: [Product]
    }

    type Product @key(fields: "upc") {
      upc: String!
      reviews: [Review]
    }

    type Review @key(fields: "id") {
      id: ID!
      author: User @provides(fields: "displayName")
    }

    type User @key(fields: "id") {
      id: ID!
      displayName: String @external
    }
  users: |-
    schema {
      query: Query
    }

    type Query {
      userById(id: ID! @is(field: "id")): User @lookup @internal
    }

    type User @key(fields: "id") {
      id: ID!
      displayName: String @shareable
    }
  accounts: |-
    schema {
      query: Query
    }

    type Query {
      userById(id: ID! @is(field: "id")): User @lookup @internal
    }

    type User @key(fields: "id") {
      id: ID!
      displayName: String @shareable
    }
