name: Fusion RequirementCrossEntityTests.Plan_Should_Reenter_Requiring_Schema_When_Requiring_Type_Has_Lookup
description: Imported from ChilliCream/graphql-platform 972f3f9 (972f3f9e39f19614d625cd3948a52c5d89565d03), src/HotChocolate/Fusion/test/Fusion.Execution.Tests/Planning/RequirementCrossEntityTests.cs. MIT License.
subgraphs:
  cart: |-
    schema {
      query: Query
    }

    type Query {
      cart: Cart
      cartItemById(id: ID! @is(field: "id")): CartItem @lookup @internal
      productById(id: ID! @is(field: "id")): Product @lookup @internal
    }

    type Cart {
      id: ID!
      items: [CartItem!]
    }

    type CartItem {
      id: ID!
      product: Product!
      unitPrice(price: Float! @require(field: "product.discountedPrice")): Float!
    }

    type Product @key(fields: "id") {
      id: ID!
    }
  promotions: |-
    schema {
      query: Query
    }

    type Query {
      productById(id: ID! @is(field: "id")): Product @lookup @internal
    }

    type Product @key(fields: "id") {
      id: ID!
      discountedPrice: Float!
    }
