subgraphs:
  store: |-
    schema {
      query: Query
    }

    type Query {
      products: [Product]
    }

    type Product @key(fields: "id") {
      id: ID! @shareable
      name: String!
    }
  info: |-
    schema {
      query: Query
    }

    type Query {
      productById(id: ID! @is(field: "id")): Product @lookup @internal
    }

    type Product
      @key(fields: "id") {
      id: ID! @shareable
      uuid: ID! @shareable
      isAvailable: Boolean!
    }
  cost: |-
    schema {
      query: Query
    }

    type Query {
      productByUuid(uuid: ID! @is(field: "uuid")): Product @lookup @internal
    }

    type Product @key(fields: "uuid") {
      uuid: ID! @shareable
      price: Price
    }

    type Price {
      amount: Float!
      currency: String!
    }
