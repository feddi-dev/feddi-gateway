    type Product @key(fields: "id") {
      id: ID!
      variants: [Variant]
    }

    type Variant {
      price: Float!
    }

    scalar Upload
  b: |-
    schema {
      query: Query
    }

    type Query {
      productById(id: ID! @is(field: "id")): Product @lookup @internal
    }

    type Product @key(fields: "id") {
      id: ID!
      discountedPrice(
        prices: [PriceInput!]!
          @require(field: "variants[{ price: price }]")): Float!
    }

    input PriceInput {
      price: Float!
    }
