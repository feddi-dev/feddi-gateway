subgraphs:
  a: |-
    schema {
      query: Query
      mutation: Mutation
    }

    type Query {
      products: [Product]
      productById(id: ID! @is(field: "id")): Product @lookup @internal
    }

    type Mutation {
      uploadProductPicture(file: Upload!): Boolean
