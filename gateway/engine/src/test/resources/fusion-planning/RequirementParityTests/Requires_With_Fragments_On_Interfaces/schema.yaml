name: Fusion RequirementParityTests.Requires_With_Fragments_On_Interfaces
description: Imported from ChilliCream/graphql-platform 972f3f9 (972f3f9e39f19614d625cd3948a52c5d89565d03), src/HotChocolate/Fusion/test/Fusion.Execution.Tests/Planning/RequirementParityTests.cs. MIT License.
subgraphs:
  a: |-
    schema {
      query: Query
    }

    type Query {
      userFromA: User
    }

    type User @key(fields: "id") {
      id: ID!
      profile: Profile! @shareable
    }

    interface Profile {
      displayName: String!
    }

    interface Account implements Profile {
      displayName: String!
      accountType: String!
    }

    type GuestAccount implements Profile & Account {
      displayName: String! @shareable
      accountType: String! @shareable
      guestToken: String! @shareable
    }

    type AdminAccount implements Profile & Account {
      displayName: String! @shareable
      accountType: String! @shareable
      adminLevel: String! @shareable
    }
  b: |-
    schema {
      query: Query
    }

    type Query {
      userById(id: ID! @is(field: "id")): User @lookup @internal
    }

    type User @key(fields: "id") {
      id: ID!
      profile: Profile! @shareable
      permissions(
        displayName: String! @require(field: "profile.displayName")
        accountType: String
          @require(field:
            "profile<AdminAccount>.accountType | profile<GuestAccount>.accountType")
        adminLevel: String
          @require(field: "profile<AdminAccount>.adminLevel")
        guestToken: String
          @require(field: "profile<GuestAccount>.guestToken")): String!
    }

    interface Profile {
      displayName: String!
    }

    interface Account implements Profile {
      displayName: String!
      accountType: String!
    }

    type GuestAccount implements Profile & Account {
      displayName: String! @shareable
      accountType: String! @shareable
      guestToken: String! @shareable
    }

    type AdminAccount implements Profile & Account {
      displayName: String! @shareable
      accountType: String! @shareable
      adminLevel: String! @shareable
    }
